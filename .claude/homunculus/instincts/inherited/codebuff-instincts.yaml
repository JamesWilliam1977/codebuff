# Codebuff Workflow Sync Public Snapshot

## Action

Follow the sync-public-snapshot workflow:
1. Export or sync changes from the private repository.
2. Update lockfile (bun.lock) to reflect dependency changes.
3. Optionally update release package.json files if CLI or release changes occurred.
4. Optionally update or add new source files (e.g., components, types) if relevant features or fixes were made.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~15x per month
- Files: bun.lock, cli/release/package.json, freebuff/cli/release/package.json

